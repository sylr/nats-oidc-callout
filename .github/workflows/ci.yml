---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Each job runs inside a per-job Nix dev shell (`nix develop .#ci-<job>`) that
# carries only the tools that job needs, so the toolchain — golangci-lint,
# goreleaser, kind, kubectl, … — is the exact same version locally and in CI
# while keeping each job's /nix/store cache minimal. The Go compiler is selected by
# go.mod's `go` directive (GOTOOLCHAIN), which the pinned go bootstraps.
jobs:
  test:
    runs-on: ubuntu-latest
    # No id-token: write here on purpose — the real-GitHub-OIDC e2e
    # (TestGitHubActionsToken) self-skips without the token endpoint and runs
    # in the dedicated github-oidc-e2e job below instead.
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    # Cache /nix/store across runs so the dev shell isn't re-realized from
    # cache.nixos.org every time. Per-job key (github.job) because each job's
    # shell has a different closure; gc caps the store before saving so the
    # GitHub cache entry stays bounded.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    # Go build/module cache (there is no setup-go to provide one). Probe the
    # paths with GOTOOLCHAIN=local so this step does not fetch the go.mod
    # toolchain before the cache is restored. GOMODCACHE also holds the
    # downloaded toolchain, and go.mod (which pins the go version) keys it.
    - name: Go cache paths
      id: go-cache
      run: |
        out=$(nix develop .#ci-test --command bash -c 'GOTOOLCHAIN=local go env GOCACHE GOMODCACHE')
        {
          echo "gocache=$(printf '%s\n' "$out" | sed -n 1p)"
          echo "gomodcache=$(printf '%s\n' "$out" | sed -n 2p)"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: |
          ${{ steps.go-cache.outputs.gocache }}
          ${{ steps.go-cache.outputs.gomodcache }}
          ~/.cache/golangci-lint
        key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum', 'lib/awsauth/go.mod', 'lib/awsauth/go.sum', 'lib/k8sauth/go.mod', 'lib/k8sauth/go.sum', 'go.work', 'go.work.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    # GOWORK=off on the root checks proves go.mod's require+replace are
    # self-sufficient and not silently propped up by the committed go.work. The
    # nested lib/* modules are separate modules: `./...` stops at their go.mod,
    # so each needs its own dedicated run (also GOWORK=off for determinism).
    - name: Verify modules are tidy
      run: |
        nix develop .#ci-test --command bash -c '
          set -e
          GOWORK=off go mod tidy
          for m in lib/awsauth lib/k8sauth; do (cd "$m" && GOWORK=off go mod tidy); done
          git diff --exit-code -- go.mod go.sum lib/awsauth/go.mod lib/awsauth/go.sum lib/k8sauth/go.mod lib/k8sauth/go.sum'

    - name: Vet
      run: |
        nix develop .#ci-test --command bash -c '
          set -e
          GOWORK=off go vet ./...
          for m in lib/awsauth lib/k8sauth; do (cd "$m" && GOWORK=off go vet ./...); done'

    - name: golangci-lint
      run: |
        nix develop .#ci-test --command bash -c '
          set -e
          GOWORK=off golangci-lint run ./...
          for m in lib/awsauth lib/k8sauth; do (cd "$m" && GOWORK=off golangci-lint run ./...); done'

    - name: Test (race + hermetic e2e)
      run: |
        nix develop .#ci-test --command bash -c '
          set -e
          GOWORK=off go test -race -count=1 ./...
          for m in lib/awsauth lib/k8sauth; do (cd "$m" && GOWORK=off go test -race -count=1 ./...); done'

    - name: Build (all tags compile)
      run: nix develop .#ci-test --command bash -c 'GOWORK=off go build ./... && GOWORK=off go vet -tags e2e_aws ./test/e2e/...'

    # Workspace mode (go.work active): proves the committed go.work / go.work.sum
    # resolve and are not stale. Fails if go.work.sum is missing entries.
    - name: Workspace resolves
      run: nix develop .#ci-test --command go build ./...

  github-oidc-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Exposes ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN so TestGitHubActionsToken can
      # mint a real GitHub OIDC token. Fork PRs don't get it → the test skips and
      # this job is green.
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    # Cache /nix/store across runs so the dev shell isn't re-realized from
    # cache.nixos.org every time. Per-job key (github.job) because each job's
    # shell has a different closure; gc caps the store before saving so the
    # GitHub cache entry stays bounded.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    # Go build/module cache (see the test job for why GOTOOLCHAIN=local).
    - name: Go cache paths
      id: go-cache
      run: |
        out=$(nix develop .#ci-github-oidc-e2e --command bash -c 'GOTOOLCHAIN=local go env GOCACHE GOMODCACHE')
        {
          echo "gocache=$(printf '%s\n' "$out" | sed -n 1p)"
          echo "gomodcache=$(printf '%s\n' "$out" | sed -n 2p)"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        # Same path list and key as the test job so the two jobs share one Go
        # cache (golangci-lint dir included only for parity; unused here).
        path: |
          ${{ steps.go-cache.outputs.gocache }}
          ${{ steps.go-cache.outputs.gomodcache }}
          ~/.cache/golangci-lint
        key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum', 'lib/awsauth/go.mod', 'lib/awsauth/go.sum', 'lib/k8sauth/go.mod', 'lib/k8sauth/go.sum', 'go.work', 'go.work.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: GitHub OIDC end-to-end (embedded nats-server + callout + real token)
      run: nix develop .#ci-github-oidc-e2e --command go test -race -count=1 -v -run TestGitHubActionsToken ./test/e2e/...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    # Cache /nix/store across runs so the dev shell isn't re-realized from
    # cache.nixos.org every time. Per-job key (github.job) because each job's
    # shell has a different closure; gc caps the store before saving so the
    # GitHub cache entry stays bounded.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    - name: goreleaser check
      run: nix develop .#ci-goreleaser-check --command goreleaser check

  k8s-e2e:
    runs-on: ubuntu-latest
    # Uses the Docker daemon preinstalled on the runner; kind and kubectl come
    # from the Nix dev shell. run.sh creates a kind cluster, builds + loads the
    # callout image, deploys NATS + callout, and asserts the projected
    # service-account-token flow (allow nats-client / deny default SA).
    #
    # The image build is left to run.sh's plain `docker build`: experiments with
    # buildx layer caching and BuildKit cache-mount persistence (cache-dance)
    # only matched this baseline -- the kind spin-up + deploy + assert (~64s),
    # not the build, dominates the job.
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    # Cache /nix/store across runs so the dev shell isn't re-realized from
    # cache.nixos.org every time. Per-job key (github.job) because each job's
    # shell has a different closure; gc caps the store before saving so the
    # GitHub cache entry stays bounded.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    - name: Kubernetes service-account-token e2e (kind)
      run: nix develop .#ci-k8s-e2e --command bash test/k8s/run.sh

  helm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    # Cache /nix/store across runs so the dev shell isn't re-realized from
    # cache.nixos.org every time. Per-job key (github.job) because each job's
    # shell has a different closure; gc caps the store before saving so the
    # GitHub cache entry stays bounded.
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    - name: helm lint
      run: nix develop .#ci-helm --command helm lint contribs/chart

    # Render several value permutations and validate every manifest against the
    # k8s OpenAPI schemas. -ignore-missing-schemas skips CRDs (ServiceMonitor)
    # that have no published schema.
    - name: helm template + kubeconform
      run: |
        nix develop .#ci-helm --command bash -c '
          set -euo pipefail
          permutations=(
            ""
            "--set metrics.enabled=false"
            "--set metrics.serviceMonitor.enabled=true --set podDisruptionBudget.enabled=true --set replicaCount=2"
            "--set config.existingSecret=ext --set policy.values.rules[0].name=k8s-app"
          )
          for v in "${permutations[@]}"; do
            echo "== helm template $v =="
            helm template t contribs/chart $v \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.31.0
          done'

    # Release contract: package the chart the way release.yml does and assert
    # the default image it renders is one goreleaser publishes (v{{ .Version }}).
    # Plain `helm lint` cannot catch this -- a tag without the "v" is still a
    # syntactically valid image reference. Covers a stable and a prerelease tag.
    - name: chart release contract (image tag)
      run: |
        nix develop .#ci-helm --command bash -c '
          set -euo pipefail
          out="$(mktemp -d)"
          for tag in v1.2.3 v1.2.3-rc.1; do
            scripts/package-chart.sh "$tag" "$out" >/dev/null
          done'
