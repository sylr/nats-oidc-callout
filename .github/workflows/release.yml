---
name: Release

on:
  push:
    tags:
    - "v*"

permissions:
  contents: write
  packages: write

# goreleaser runs inside the repo's Nix dev shell (nix develop .#ci-release) so
# the release ships with the exact goreleaser/syft/go versions the CI
# goreleaser-check job validated against -- no `latest` drift between checking
# and building the release. Docker (qemu/buildx/login) stays as runner setup.
jobs:
  goreleaser:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    # Multi-arch (linux/amd64+arm64) container builds via dockers_v2 need QEMU
    # for the non-native arch plus a buildx builder.
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # goreleaser (and the syft it shells out to for SBOMs) comes from the Nix
    # shell -- same pinned versions as the goreleaser-check CI job.
    #
    # The lib/* Go modules are tagged lib/<module>/vX.Y.Z. Those tags never
    # trigger this workflow ("v*" only matches tags starting with "v"), but
    # goreleaser's own detection would still pick one up as the previous tag
    # (git describe) and truncate the changelog, or as the current tag if it
    # points at the same commit. Pin both to service tags only; the goreleaser
    # OSS config has no tag-prefix filter (ignore_tag_prefixes is Pro-only).
    - name: Run goreleaser
      run: |
        GORELEASER_PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GORELEASER_CURRENT_TAG}^" 2>/dev/null || true)"
        export GORELEASER_PREVIOUS_TAG
        nix develop .#ci-release --command goreleaser release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  # Publish the Helm chart as an OCI artifact to ghcr.io alongside the image.
  # Runs after goreleaser so the chart's appVersion points at an image that has
  # already been pushed. Each release is a unique, immutable chart version.
  # The chart `version` is the tag without its "v" (Helm requires SemVer), but
  # `appVersion` -- the default image tag -- keeps the "v" because goreleaser
  # publishes the image as v{{ .Version }}. scripts/package-chart.sh packages
  # that way and refuses to continue unless the packaged chart renders the
  # exact image reference goreleaser published.
  helm-chart:
    runs-on: ubuntu-26.04
    needs: goreleaser
    steps:
    - uses: actions/checkout@v7

    - uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ github.job }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ github.job }}-
        gc-max-store-size-linux: 1G

    - name: Package and push chart to ghcr.io (OCI)
      env:
        GITHUB_REF_NAME: ${{ github.ref_name }}
        REGISTRY_USER: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        OWNER: ${{ github.repository_owner }}
      run: |
        nix develop .#ci-helm --command bash -c '
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin
          repo="oci://ghcr.io/$OWNER/helm-charts"
          # Each release tag is a unique, immutable chart version (tag minus "v").
          # ghcr.io has no tag immutability, so helm push would SILENTLY overwrite
          # an existing version -- guard so a re-run of the same tag is a no-op
          # instead of clobbering published bytes.
          if helm show chart "$repo/nats-oidc-callout" --version "$version" >/dev/null 2>&1; then
            echo "chart nats-oidc-callout $version already published; nothing to push"
            exit 0
          fi
          # Package into a dedicated empty dir and push the exact file helm
          # reports -- never a dist/*.tgz glob, which could match a stray archive.
          # The script logs to stderr (visible in CI) and prints only the path.
          out="$(mktemp -d)"
          pkg="$(scripts/package-chart.sh "$GITHUB_REF_NAME" "$out")"
          helm push "$pkg" "$repo"'
